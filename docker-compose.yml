services:
  download:
    image: curlimages/curl:latest
    platform: linux/arm64
    volumes:
      - ./data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "=== Downloading RDF files ==="
        cd /data

        download() {
          url="$$1"
          filename=$$(basename "$$url" | sed 's/?.*$$//')
          if [ -f "$$filename" ]; then
            echo "  Already exists, skipping: $$filename"
          else
            echo "  Downloading: $$filename"
            curl -L --fail --show-error -o "$$filename" "$$url"
          fi
        }

        download "https://raw.githubusercontent.com/research-software-ecosystem/content/refs/heads/master/datasets/bioschemas-dump.ttl"

        download "https://raw.githubusercontent.com/research-software-ecosystem/content/refs/heads/master/datasets/bioschemas-biii-dump.ttl"
        download "https://raw.githubusercontent.com/research-software-ecosystem/content/refs/heads/master/datasets/bioconda-dump.ttl"
        #download "https://raw.githubusercontent.com/research-software-ecosystem/content/refs/heads/master/datasets/bioconductor-dump.ttl"
        download "https://raw.githubusercontent.com/research-software-ecosystem/content/refs/heads/master/datasets/biocontainers-dump.ttl"
        download "https://raw.githubusercontent.com/research-software-ecosystem/content/refs/heads/master/datasets/debian-dump.ttl"
        download "https://raw.githubusercontent.com/research-software-ecosystem/content/refs/heads/master/datasets/galaxy-dump.ttl"

        download "https://raw.githubusercontent.com/research-software-ecosystem/content/refs/heads/master/datasets/galaxyworkflow-dump.ttl"
        download "https://raw.githubusercontent.com/research-software-ecosystem/content/refs/heads/master/datasets/workflowhub-dump.ttl"

        # Add more files here:
        # download "https://example.org/another-file.ttl"

        echo "=== Downloads complete ==="

  fuseki:
    image: stain/jena-fuseki:latest
    platform: linux/amd64
    depends_on:
      download:
        condition: service_completed_successfully
    ports:
      - "3030:3030"
    volumes:
      - ./data:/staging:ro
      - fuseki-db:/fuseki
    environment:
      ADMIN_PASSWORD: "admin"
      FUSEKI_DATASET_1: "ds"
      TDB: "2"
      JVM_ARGS: "-Xmx4g"
    restart: unless-stopped

volumes:
  fuseki-db:
